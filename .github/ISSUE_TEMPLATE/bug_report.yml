name: 缺陷报告
description: 报告可以稳定复现的软件问题
title: "[Bug] "
labels:
  - bug
body:
  - type: checkboxes
    attributes:
      label: 数据安全确认
      options:
        - label: 我已删除真实账套、发票、税号、手机号、密码、Token 和本机用户名路径
          required: true
  - type: input
    attributes:
      label: 软件版本
      placeholder: 例如 1.7.0
    validations:
      required: true
  - type: input
    attributes:
      label: Windows 与硬件环境
      placeholder: 例如 Windows 11 24H2、NVIDIA/CPU 模式
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
      description: 请使用合成数据给出最小、连续的复现步骤
    validations:
      required: true
  - type: textarea
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    attributes:
      label: 脱敏日志或截图
      description: 请勿上传真实财税资料；安全漏洞请使用私密漏洞报告

